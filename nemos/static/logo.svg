<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40"
     role="img" aria-label="NEMOS">
  <title>NEMOS</title>
  <defs>
    <linearGradient id="nemos-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132c42"/>
      <stop offset="1" stop-color="#070d16"/>
    </linearGradient>
    <linearGradient id="nemos-stroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1a86c4"/>
      <stop offset="1" stop-color="#3ec8f4"/>
    </linearGradient>
  </defs>

  <!-- The tile carries the mark's own ground, so it reads identically on a
       light page as on a dark one. -->
  <rect width="40" height="40" rx="10" fill="url(#nemos-tile)"/>
  <rect x="0.6" y="0.6" width="38.8" height="38.8" rx="9.4"
        fill="none" stroke="#3ec8f4" stroke-opacity="0.22"/>

  <!-- A shield says defensive monitoring before a word is read. The trace
       crossing it is what keeps it from being a generic padlock badge: NEMOS
       watches traffic, and the one spike breaking the line is the finding. -->
  <path d="M20 8 L29 12 V20.5 C29 26 24.8 30 20 32 C15.2 30 11 26 11 20.5 V12 Z"
        fill="none" stroke="url(#nemos-stroke)" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M13.5 21 h3.2 l2.1 -5.4 l2.4 8.4 l1.9 -3 h3.4"
        fill="none" stroke="#3ec8f4" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
