<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="NEMOS">
  <title>NEMOS</title>
  <defs>
    <linearGradient id="fav-stroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1a86c4"/>
      <stop offset="1" stop-color="#3ec8f4"/>
    </linearGradient>
  </defs>
  <!-- Same mark as logo.svg. The strokes are a shade heavier because a tab
       favicon is rasterised at 16px and hairlines disappear there. -->
  <path d="M16 1.8 L28 8.8 V23.2 L16 30.2 L4 23.2 V8.8 Z"
        fill="#0b1220" stroke="#3ec8f4" stroke-opacity="0.30" stroke-width="1.2"/>
  <path d="M11.2 21.8 V10.2 L20.8 21.8 V10.2" fill="none" stroke="url(#fav-stroke)"
        stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
