<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="NEMOS">
  <title>NEMOS</title>
  <defs>
    <linearGradient id="fav-stroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1a86c4"/>
      <stop offset="1" stop-color="#3ec8f4"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0b1220"/>
  <!-- Same mark as logo.svg, drawn larger in its frame and with heavier
       strokes: a tab favicon is rasterised at 16px, where the tile padding is
       wasted room and a hairline disappears entirely. -->
  <path d="M16 4 L26 8.4 V17.8 C26 23.4 21.3 27.8 16 29.6 C10.7 27.8 6 23.4 6 17.8 V8.4 Z"
        fill="none" stroke="url(#fav-stroke)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M9.4 18.4 h3 l2.1 -5.2 l2.4 8.4 l1.9 -3.2 h3.4"
        fill="none" stroke="#3ec8f4" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
